<div class="row g-2">
 <div class="col-5"><label class="form-label small mb-0 w-100">SKU
  <input class="form-control form-control-sm" name="sku" maxlength="30" placeholder="FINTR-02" required></label></div>
 <div class="col-7"><label class="form-label small mb-0 w-100">Name
  <input class="form-control form-control-sm" name="name" maxlength="80" placeholder="Expansion pack" required></label></div>
 <div class="col-4"><label class="form-label small mb-0 w-100">Ex-factory (R)
  <input class="form-control form-control-sm" name="ex_factory_zar" type="number" min="0" step="0.01" required></label></div>
 <div class="col-4"><label class="form-label small mb-0 w-100">Landed (R)
  <input class="form-control form-control-sm" name="landed_cost_zar" type="number" min="0" step="0.01" required></label></div>
 <div class="col-4"><label class="form-label small mb-0 w-100">Retail (R)
  <input class="form-control form-control-sm" name="retail_price_zar" type="number" min="0" step="0.01" required></label></div>
</div>
