<div class="row g-2">
 <div class="col-6"><label class="form-label small mb-0">Region
  <select class="form-select form-select-sm" name="region" required><option value="us">US</option><option value="uk">UK</option></select></label></div>
 <div class="col-6"><label class="form-label small mb-0">Order type
  <select class="form-select form-select-sm" name="order_type" required><option>Consumer</option><option>Restock</option></select></label></div>
 <div class="col-12"><label class="form-label small mb-0 w-100">Route (how it is sent)
  <select class="form-select form-select-sm" name="route" required></select></label></div>
 <div class="col-12"><label class="form-label small mb-0 w-100">Product
  <select class="form-select form-select-sm" name="sku" required><option value="FINTR-01">FINTR-01</option></select></label></div>
 <div class="col-6"><label class="form-label small mb-0">Month
  <input class="form-control form-control-sm" name="order_month" type="month" required></label></div>
 <div class="col-6"><label class="form-label small mb-0">Units
  <input class="form-control form-control-sm" name="units" type="number" min="1" step="1" required></label></div>
</div>
